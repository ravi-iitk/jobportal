name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server
        run: cd server && npm install
      - name: Install client
        run: cd client && npm install
      - name: Build client
        run: cd client && npm run build
